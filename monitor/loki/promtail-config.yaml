server:
  http_listen_port: 9080  # Port where Promtail will listen for webhooks
  log_level: debug
positions:
  filename: /tmp/positions.yaml  # Position file for tracking log positions

clients:
  - url: http://loki:3100/loki/api/v1/push  # Update with your Loki address and port

scrape_configs:
  - job_name: 'alertmanager'
    static_configs:
      - targets:
          - localhost:9080  # Promtail's own endpoint for webhooks
    pipeline_stages:
      - json:
          expressions:
            alertname: alertname
            description: description
            severity: severity
      - labels:
          alertname: alertname
          severity: severity
