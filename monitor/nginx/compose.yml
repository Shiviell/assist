version: '3'
services:
  nginx:
    image: nginx:alpine
    container_name: nginxFS
      #restart: always
    ports:
      - "80:80"  # Map port 80 in the container to port 8080 on the host
    volumes:
      - /opt/files:/srv:ro  # Mount /opt/files from the host as read-only
        #- ./nginx.conf:/etc/nginx/nginx.conf:ro  # Use the custom Nginx config
      - ./conf.d:/etc/nginx/conf.d:ro
