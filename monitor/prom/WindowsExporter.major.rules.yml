groups:

- name: WindowsExporter.major.rules

  rules:

    - alert: WindowsServerServiceStatus
      expr: 'windows_service_status{status="ok"} != 1'
      for: 1m
      labels:
        severity: major
      annotations:
        summary: Windows Server service Status (instance {{ $labels.instance }})
        description: "Windows Service state is not OK\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: WindowsServerCpuUsage
      expr: '90 <(100 - (avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[2m])) * 100)) < 95'
      for: 5m
      labels:
        severity: major
      annotations:
        summary: Windows Server CPU Usage (instance {{ $labels.instance }})
        description: "CPU Usage is more than 80%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: WindowsServerMemoryUsage
      expr: '90 < (100 - ((windows_os_physical_memory_free_bytes / windows_cs_physical_memory_bytes) * 100)) < 95'
      for: 5m
      labels:
        severity: major
      annotations:
        summary: Windows Server memory Usage (instance {{ $labels.instance }})
        description: "Memory usage is more than 90%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: WindowsServerDiskSpaceUsage
      expr: '85 < (100.0 - 100 * ((windows_logical_disk_free_bytes / 1024 / 1024 ) / (windows_logical_disk_size_bytes / 1024 / 1024))) < 90'
      for: 2m
      labels:
        severity: major
      annotations:
        summary: Windows Server disk Space Usage (instance {{ $labels.instance }})
        description: "Disk usage is more than 80%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"